---
- name: Open firewall port for llama-server
  ansible.posix.firewalld:
    port: "{{ llamacpp_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
    zone: "{{ llamacpp_firewall_zone }}"
  when: llamacpp_open_firewall | bool

- name: Install systemd unit for llama-server
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart llama-server

- name: Enable and start llama-server
  ansible.builtin.systemd:
    name: llama-server
    state: started
    enabled: true

- name: Wait for server health endpoint
  block:
    - name: Poll /health until llama-server is ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llamacpp_port }}/health"
        status_code: 200
        timeout: 5
      register: health
      retries: 30
      delay: 5
      until: health.status == 200
  rescue:
    - name: Capture llama-server status
      ansible.builtin.command: systemctl status llama-server --no-pager --lines=0
      changed_when: false
      failed_when: false
      register: llama_status

    - name: Capture recent llama-server logs
      ansible.builtin.command: journalctl -u llama-server -n 80 --no-pager
      changed_when: false
      failed_when: false
      register: llama_logs

    - name: Report why llama-server is not healthy
      ansible.builtin.fail:
        msg: |-
          llama-server did not report healthy on port {{ llamacpp_port }} within the timeout.

          ===== systemctl status llama-server =====
          {{ llama_status.stdout }}

          ===== journalctl -u llama-server (last 80 lines) =====
          {{ llama_logs.stdout }}

- name: Deployment successful
  ansible.builtin.debug:
    msg: >-
      llama-server is UP and healthy on port {{ llamacpp_port }}.
      API: http://{{ ansible_host | default('localhost') }}:{{ llamacpp_port }}/v1/chat/completions
      Web UI: http://{{ ansible_host | default('localhost') }}:{{ llamacpp_port }}/
