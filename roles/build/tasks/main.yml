---
- name: Install backend-specific packages
  ansible.builtin.dnf:
    name: "{{ vulkan_packages }}"
    state: present
  when: llamacpp_backend == 'vulkan'

- name: Warn if CUDA backend selected
  ansible.builtin.debug:
    msg: >-
      CUDA backend selected: make sure the NVIDIA driver and the CUDA toolkit
      (nvcc) are already installed on this machine — the playbook will build
      with -DGGML_CUDA=ON.
  when: llamacpp_backend == 'cuda'

- name: Trust install dir for git operations (root vs service-user ownership)
  ansible.builtin.command: git config --global --add safe.directory {{ llamacpp_install_dir }}
  changed_when: false
  failed_when: false

- name: Check out llama.cpp source
  ansible.builtin.git:
    repo: "{{ llamacpp_repo }}"
    dest: "{{ llamacpp_install_dir }}"
    version: "{{ llamacpp_version }}"
    depth: 1
    force: true

- name: Fix source tree ownership for service user
  ansible.builtin.file:
    path: "{{ llamacpp_install_dir }}"
    state: directory
    owner: "{{ llamacpp_user }}"
    group: "{{ llamacpp_group }}"
    recurse: true

- name: Register current build config
  ansible.builtin.slurp:
    src: "{{ llamacpp_install_dir }}/build/.build-config"
  register: current_build_config
  failed_when: false

- name: Compute desired build config
  ansible.builtin.set_fact:
    desired_build_config: "{{ llamacpp_version }}:{{ llamacpp_backend }}:all-cli"

- name: Set rebuild flag when config changed
  ansible.builtin.set_fact:
    rebuild_required: >-
      {{ (current_build_config.content | default('') | b64decode | trim) != desired_build_config }}

- name: Configure llama.cpp (CMake)
  ansible.builtin.command: >-
    cmake -B build
    -DGGML_NATIVE=ON
    -DLLAMA_BUILD_SERVER=ON
    -DLLAMA_BUILD_EXAMPLES=ON
    -DGGML_VULKAN={{ 'ON' if llamacpp_backend == 'vulkan' else 'OFF' }}
    -DGGML_CUDA={{ 'ON' if llamacpp_backend == 'cuda' else 'OFF' }}
    -DCMAKE_BUILD_TYPE=Release
  args:
    chdir: "{{ llamacpp_install_dir }}"
  when: rebuild_required | bool
  changed_when: true

- name: Compile llama.cpp
  community.general.make:
    chdir: "{{ llamacpp_install_dir }}/build"
    jobs: "{{ llamacpp_build_jobs }}"
    target: all
  when: rebuild_required | bool

- name: Install llama.cpp CLI tools in PATH
  ansible.builtin.shell: >-
    find {{ llamacpp_install_dir }}/build/bin -maxdepth 1 -type f -perm /111
    ! -name '*.so' ! -name '*.so.*' -exec ln -sfn {} /usr/local/bin/ \;
  args:
    executable: /bin/bash
  changed_when: false

- name: Stamp build configuration
  ansible.builtin.copy:
    content: "{{ desired_build_config }}\n"
    dest: "{{ llamacpp_install_dir }}/build/.build-config"
    mode: "0644"

- name: Ensure server binary is executable
  ansible.builtin.file:
    path: "{{ llamacpp_install_dir }}/build/bin/llama-server"
    mode: "0755"

# Restore SELinux contexts so systemd can exec the binaries/libraries.
# In-place builds under /opt normally inherit the right label, but a tree
# copied/moved from a home dir carries home_t and triggers status=203/EXEC
# (Permission denied) under enforcing SELinux. restorecon makes this robust.
- name: Restore SELinux context on install dir
  ansible.builtin.command: restorecon -RF {{ llamacpp_install_dir }}
  changed_when: false
  failed_when: false
  when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
