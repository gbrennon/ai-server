---
- name: Stat existing model file
  ansible.builtin.stat:
    path: "{{ llamacpp_models_dir }}/{{ llamacpp_model_file }}"
  register: model_file

- name: Download GGUF model (resumable, via curl as service user)
  ansible.builtin.command: >-
    curl -fL --retry 5 --retry-delay 5 -C -
    -o {{ llamacpp_models_dir }}/{{ llamacpp_model_file }}
    {{ llamacpp_model_url }}
  become: true
  become_user: "{{ llamacpp_user }}"
  when: not model_file.stat.exists
  changed_when: true
  args:
    creates: "{{ llamacpp_models_dir }}/{{ llamacpp_model_file }}"

- name: Ensure model file ownership
  ansible.builtin.file:
    path: "{{ llamacpp_models_dir }}/{{ llamacpp_model_file }}"
    owner: "{{ llamacpp_user }}"
    group: "{{ llamacpp_group }}"
  when: model_file.stat.exists

- name: Report model size
  ansible.builtin.command: du -h {{ llamacpp_models_dir }}/{{ llamacpp_model_file }}
  register: model_size
  changed_when: false

- name: Show model size
  ansible.builtin.debug:
    msg: "Model ready: {{ llamacpp_model_file }} ({{ model_size.stdout.split()[0] }})"
