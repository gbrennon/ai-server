---
- name: Stat existing model file on target
  ansible.builtin.stat:
    path: "{{ llamacpp_models_dir }}/{{ llamacpp_model_file }}"
  register: model_file

- name: Verify local model source exists (controller)
  ansible.builtin.stat:
    path: "{{ llamacpp_model_src }}"
  delegate_to: localhost
  become: false
  register: model_src_stat
  when:
    - not model_file.stat.exists
    - (llamacpp_model_src | default('')) | length > 0

- name: Fail early when local model source is missing
  ansible.builtin.assert:
    that: model_src_stat.stat.exists
    fail_msg: >-
      llamacpp_model_src is set to '{{ llamacpp_model_src }}' but that file
      does not exist on the controller.
  when:
    - not model_file.stat.exists
    - (llamacpp_model_src | default('')) | length > 0

- name: Push local model to target (rsync, resumable)
  ansible.posix.synchronize:
    src: "{{ llamacpp_model_src }}"
    dest: "{{ llamacpp_models_dir }}/{{ llamacpp_model_file }}"
    # Play runs with become; rsync must land in the root/llama-owned models
    # dir, so escalate the remote side of the transfer via passwordless sudo.
    # Use the dedicated rsync_path param (not rsync_opts) so the module quotes
    # "sudo rsync" correctly on the remote.
    rsync_path: "sudo rsync"
  become: false
  when:
    - not model_file.stat.exists
    - (llamacpp_model_src | default('')) | length > 0

# Accept either a direct .gguf URL or a Hugging Face repo root URL. For a
# repo root, build the standard resolve link from the (bare) filename:
#   https://huggingface.co/<owner>/<repo>/resolve/main/<file>.gguf
# For a file that lives in a repo subfolder (e.g. MTP/<file>.gguf), pass the
# full direct .gguf URL instead and keep llamacpp_model_file a bare filename.
- name: Resolve GGUF download URL
  ansible.builtin.set_fact:
    llamacpp_model_dl_url: >-
      {{ llamacpp_model_url
         if (llamacpp_model_url | regex_search('\.gguf($|\?)'))
         else (llamacpp_model_url | regex_replace('/+$', '')
               ~ '/resolve/main/' ~ llamacpp_model_file) }}
  when:
    - not model_file.stat.exists
    - (llamacpp_model_src | default('')) | length == 0

- name: Download GGUF model (resumable)
  ansible.builtin.command: >-
    curl -fL --retry 5 --retry-delay 5 -C -
    -o {{ llamacpp_models_dir }}/{{ llamacpp_model_file }}
    {{ llamacpp_model_dl_url }}
  when:
    - not model_file.stat.exists
    - (llamacpp_model_src | default('')) | length == 0
  changed_when: true
  args:
    creates: "{{ llamacpp_models_dir }}/{{ llamacpp_model_file }}"

- name: Ensure model file ownership
  ansible.builtin.file:
    path: "{{ llamacpp_models_dir }}/{{ llamacpp_model_file }}"
    owner: "{{ llamacpp_user }}"
    group: "{{ llamacpp_group }}"

- name: Report model size
  ansible.builtin.command: du -h {{ llamacpp_models_dir }}/{{ llamacpp_model_file }}
  register: model_size
  changed_when: false

- name: Show model size
  ansible.builtin.debug:
    msg: "Model ready: {{ llamacpp_model_file }} ({{ model_size.stdout.split()[0] }})"
