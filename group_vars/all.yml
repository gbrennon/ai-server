---
# ============================================================================
# llama.cpp server configuration — tune everything here.
# Works on Fedora Server and Rocky Linux (any dnf-based distro).
# ============================================================================

# --- Service user / paths ---
llamacpp_user: llamacpp
llamacpp_group: llamacpp
llamacpp_install_dir: /opt/llama.cpp
llamacpp_models_dir: /var/lib/llama.cpp/models
llamacpp_logs_dir: /var/log/llama.cpp

# --- llama.cpp source ---
# Pin to a release tag, or use 'master' to track HEAD.
#
# NOTE: builds older than ~2025-08 have BROKEN MoE prompt-processing on the
# Vulkan backend (prefill ~= generation speed, ~15x too slow). The old pin
# 'b5446' (May 2025) exhibited pp512 ~75 t/s on the Strix Halo iGPU; current
# master reaches ~1250 t/s for the same Qwen3-30B-A3B model. Keep this on a
# recent build. Validated good commit: 05f2dcf (2026-09-17).
llamacpp_repo: https://github.com/ggml-org/llama.cpp.git
llamacpp_version: master

# --- Hardware backend ---
# backend: "cpu" | "vulkan" | "cuda"
# - cpu:    works everywhere, uses GGML_NATIVE for optimal SIMD codegen
# - vulkan: good for AMD/Intel GPUs (and NVIDIA without CUDA toolbox bloat)
# - cuda:   NVIDIA GPUs — requires the CUDA toolkit on the target machine
llamacpp_backend: cpu

# Build parallelism (defaults to number of CPU cores)
llamacpp_build_jobs: "{{ ansible_facts['processor_vcpus'] }}"

# --- Server runtime settings ---
llamacpp_host: 0.0.0.0
llamacpp_port: 8080
llamacpp_ctx_size: 8192
llamacpp_threads: "{{ ansible_facts['processor_vcpus'] }}"
llamacpp_extra_args: ""
# Example extra args (note: recent builds require a value for --flash-attn):
# llamacpp_extra_args: "-ngl 99 --flash-attn on --mlock"

# --- Model ---
# Any direct-download GGUF URL (Hugging Face "resolve" links work out of
# the box). Pick one that fits your hardware!
llamacpp_model_url: >-
  https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/
  Llama-3.2-3B-Instruct-Q4_K_M.gguf
llamacpp_model_file: Llama-3.2-3B-Instruct-Q4_K_M.gguf

# Optional: absolute path to a GGUF that already exists ON THE CONTROLLER.
# When set, the models role rsyncs it to the target and skips the download.
# When empty (default), the model is downloaded from llamacpp_model_url.
llamacpp_model_src: ""

# --- Firewall ---
llamacpp_open_firewall: true
llamacpp_firewall_zone: public

# --- Optional: swap size (useful on small-RAM boxes) ---
manage_swap: false
swap_file_size_mb: 4096

# --- Optional: pin the (integrated) GPU to its highest DPM state at boot ---
# On AMD APUs (e.g. Strix Halo) the iGPU idles at ~600 MHz and only ramps
# under sustained load, adding latency to short requests. Enabling this
# installs a systemd unit that forces power_dpm_force_performance_level=high.
# Generic + safe: the unit auto-detects the amdgpu card and no-ops elsewhere.
gpu_performance_mode: false
gpu_performance_level: high
