[package]
name = "evo-power-guard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "evo-power-guard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile = "3.10"
