---
# GMKtec EVO X2 mini PC profile with --parallel 4 (4-slot configuration)
# CAUTION: Testing only - 4 slots pushes memory and GPU to limits

hostname: localhost
ansible_user: root
ansible_connection: local

system_hostname: gmktec-evo-x2

# llama.cpp server settings (4 parallel slots - stress test)
llamacpp_model_url: "https://huggingface.co/Qwen/Qwen3.8-27B-UD-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_M.gguf"
llamacpp_model_name: "Qwen3.8-27B-UD-Q4_K_M.gguf"
llamacpp_model_id: "/var/lib/llama.cpp/models/Qwen3.8-27B-UD-Q4_K_M.gguf"

llamacpp_host: "0.0.0.0"
llamacpp_port: 8080
llamacpp_threads: 16
llamacpp_context_size: 0
llamacpp_gpu_layers: 99
llamacpp_cache_type_k: "q8_0"
llamacpp_cache_type_v: "q8_0"
llamacpp_split_mode: "layer"
llamacpp_flash_attn: "on"

# WARNING: 4-slot memory overhead - AT SYSTEM LIMIT
# Per-slot KV cache @ 262K (q8_0): ~32 GB
# Model weights (Q4_K_M): ~17 GB
# 4 slots: 17 + (4 × 32) = 145 GB (EXCEEDS 128 GB system)
# EXPECTED: Memory exhaustion, potential OOM, Vulkan crashes
llamacpp_extra_args: "--parallel 4 --no-prompt-cache"

llamacpp_service_restart: "on-failure"
llamacpp_service_restart_max_retries: 3
