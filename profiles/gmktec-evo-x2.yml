---
# ============================================================================
# Hardware profile: GMKtec Evo X2
#   - AMD Ryzen AI Max+ 395 "Strix Halo" (16 Zen5 cores)
#   - Radeon 8060S iGPU (RDNA 3.5, shares the 128 GB LPDDR5X)
#
# Applied by scripts/deploy-remote.sh as extra vars (overrides group_vars).
#
# IMPORTANT BIOS SETTINGS (see docs/gmktec-evo-x2.md):
#   Set UMA Frame Buffer Size to the maximum (96 GB) so Vulkan sees a large
#   dedicated VRAM pool. Without it the iGPU only gets ~512 MB and everything
#   runs in system RAM (slow).
# ============================================================================

# GPU offload via Vulkan
llamacpp_backend: vulkan
llamacpp_extra_args: "-ngl 99 --flash-attn"

# Ryzen AI Max+ 395: 16 cores
llamacpp_threads: 16

# Roomy context for the unified memory
llamacpp_ctx_size: 32768

# Default model: Qwen3-30B-A3B (MoE, ~18.6 GB) — excellent quality/speed
# balance on the 8060S: only ~3B active params per token.
# Alternatives that fit in 128 GB (edit these two lines):
#   gpt-oss-120b (MXFP4, ~63 GB):
#     https://huggingface.co/unsloth/gpt-oss-120b-GGUF/resolve/main/gpt-oss-120b-mxfp4-00001-of-00003.gguf
#     (multi-part! download manually, see docs/gmktec-evo-x2.md)
#   GLM-4.5-Air Q4_K_M (~192 GB — does NOT fit; Q3 ~110 GB, tight)
#   Llama-3.3-70B Q4_K_M (~42 GB):
#     https://huggingface.co/bartowski/Llama-3.3-70B-Instruct-GGUF/resolve/main/Llama-3.3-70B-Instruct-Q4_K_M.gguf
llamacpp_model_url: https://huggingface.co/unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF/resolve/main/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
llamacpp_model_file: Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
