  --split-mode layer --parallel 1
  --reasoning off --temp 0.2 --repeat-penalty 1.1
  --repeat-last-n 512 --frequency-penalty 0.1 --n-predict 4096
llamacpp_threads: 16
llamacpp_ctx_size: 65536
gpu_performance_mode: true
llamacpp_model_url: https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/resolve/main/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
llamacpp_model_file: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
gateway_enabled: true
gateway_dns_lan_listen: true
client_provider_name: gbrennon-server
gateway_api_hostname: api.gbrennon.home.arpa
client_max_tokens: 4096
client_reasoning: true

