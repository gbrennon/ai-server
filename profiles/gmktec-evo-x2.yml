---
llamacpp_backend: rocm
llamacpp_build_dir: /opt/llama.cpp/build-hip
llamacpp_hip_architecture: gfx1151
llamacpp_hip_compiler: /opt/rocm/llvm/bin/clang++
llamacpp_runtime_library_path: /opt/rocm/lib:/opt/rocm/lib64:/opt/rocm/core-7.14/lib
llamacpp_extra_args: >-
